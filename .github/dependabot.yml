# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    # The repo root has no project files, so list every folder that contains
    # csproj files (or Directory.Packages.props for Uno's central package management).
    directories:
      - "/Avalonia/AvaloniaUiEval"
      - "/Avalonia/AvaloniaUiEval.Android"
      - "/Avalonia/AvaloniaUiEval.Browser"
      - "/Avalonia/AvaloniaUiEval.Desktop"
      - "/Avalonia/AvaloniaUiEval.iOS"
      - "/Backend/BackendUiEval/BackendUiEval"
      - "/MAUI/MauiUiEval/MauiUiEval"
      - "/MauiBlazor/MauiBlazorhybrid/MauiBlazorhybrid"
      - "/Shared/Shared.Grpc"
      - "/unoplatform/UnoplatformUI"
      - "/unoplatform/UnoplatformUI/UnoplatformUI"
      - "/unoplatform/UnoplatformUI/UnoplatformUI.Server"
    schedule:
      interval: "weekly"
    groups:
      Microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "Azure.*"
      Opentelemetry:
        patterns:
          - "OpenTelemetry"
          - "OpenTelemetry.*"
      Serilog:
        patterns:
          - "Serilog"
          - "Serilog.*"
      xunit:
        patterns:
          - "xunit.*"
      Aspire:
        patterns:
          - "Aspire.*"
      Grpc:
        patterns:
          - "Grpc.*"
  - package-ecosystem: dotnet-sdk # See documentation for possible values
    directory: "/unoplatform/UnoplatformUI" # Only location of a global.json
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
